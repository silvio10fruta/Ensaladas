<style>
:root{--bg:#eef1f6;--c:#fff;--t:#1b2433;--m:#69758a;--b:#d3dae6;--h:#3b5a8f;--y:#fff176;--yt:#d9480f;--r:#e11d2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1520;--c:#182030;--t:#e8ecf4;--m:#8f9cb2;--b:#2b3650;--h:#4d6fae;--y:#4a4412;--yt:#ffb27a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--h);color:#fff;padding:10px 12px 0;position:sticky;top:0;z-index:5}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wk b{font-size:16px}
button{font:inherit;cursor:pointer}
.nav{background:#ffffff26;color:#fff;border:0;border-radius:8px;width:38px;height:34px;font-size:18px}
.days{display:flex;margin-top:8px}
.days button{flex:1;background:none;border:0;color:#ffffffb8;padding:7px 0 8px;border-bottom:3px solid transparent}
.days button small{display:block;font-size:11px}
.days button.on{color:#fff;font-weight:700;border-color:#fff}
.days button.today small::after{content:" •"}
.bar{display:flex;gap:8px;padding:10px 12px}
.bar button{flex:1;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:9px 6px}
.bar .pri{background:var(--h);color:#fff;border-color:var(--h)}
.seg{display:flex;margin:0 12px 8px;border:1px solid var(--b);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--c);color:var(--m);padding:8px}
.seg button.on{background:var(--h);color:#fff}
.row{background:var(--c);border-top:1px solid var(--b);padding:9px 12px}
.row.hl{background:var(--y)}
.nm{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.row.hl .nm{color:var(--yt)}
.nm span{color:var(--m);font-weight:400;font-size:12px;white-space:nowrap}
.cs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.f label{display:block;font-size:11px;color:var(--m);margin-bottom:2px}
.st{display:flex;align-items:center;border:1px solid var(--b);border-radius:9px;overflow:hidden;background:var(--c)}
.st button{border:0;background:none;color:var(--h);width:30px;height:34px;font-size:18px}
.st input{width:100%;min-width:0;border:0;background:none;color:var(--t);text-align:center;font:inherit;font-weight:600;height:34px;padding:0;-moz-appearance:textfield}
.st input::-webkit-inner-spin-button{display:none}
.f.mer .st{border-color:#e11d2e66}
.u{font-size:11px;color:var(--m);text-align:center;margin-top:2px;min-height:14px}
.tw{overflow-x:auto;margin:0 0 20px}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{border:1px solid var(--b);padding:5px 6px;text-align:center;background:var(--c)}
thead th{background:var(--h);color:#fff;position:sticky;top:0}
td.n{text-align:left;position:sticky;left:0;min-width:140px;font-weight:600;z-index:1}
tr.hl td{background:var(--y)}
tfoot td{font-weight:700}
.z{color:#0000;}
.cs.two{grid-template-columns:repeat(2,1fr)}
.cfg{display:none;gap:8px;align-items:center;padding:0 12px 8px;font-size:13px;color:var(--m);flex-wrap:wrap}.cfg input{width:46px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);text-align:center;font:inherit;padding:5px}
.info{margin:0 12px 8px;padding:9px 11px;border-radius:10px;background:var(--c);border:1px solid var(--b);font-size:13.5px;line-height:1.5}
.of{font-style:normal;font-size:10px;background:#d9480f;color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:middle}.od{font-weight:400;font-size:12px}
.hint{padding:0 12px 8px;font-size:12px;color:var(--m)}
.empty{text-align:center;color:var(--m);padding:20px}
.ph{flex:1;display:block;text-align:center;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:12px 6px;cursor:pointer;font-weight:600}
.cf2{display:flex;gap:8px;align-items:center;padding:0 12px 8px;font-size:13px;color:var(--m);flex-wrap:wrap}
.cf2 select{border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;padding:5px}
.pv{display:block;max-width:calc(100% - 24px);margin:0 12px 10px;border-radius:10px;border:1px solid var(--b)}
.ri{width:56px;border:1px solid var(--b);border-radius:7px;background:var(--c);color:var(--t);text-align:center;font:inherit;padding:5px}
details{margin:0 12px 16px;font-size:12px;color:var(--m)}details pre{white-space:pre-wrap;margin:6px 0 0}
</style></head><body>
<header>
 <div class="wk"><button class="nav" id="pv" aria-label="Semana anterior">‹</button><b id="rng"></b><button class="nav" id="nx" aria-label="Semana siguiente">›</button></div>
 <div class="days" id="days"></div>
</header>
<div class="bar"><button class="pri" id="wa">Enviar a Silvio</button><button id="cp">Copiar</button><button id="ad">+ Referencia</button></div>
<div class="bar"><button class="pri" id="au" style="background:#1f8a5b;border-color:#1f8a5b">Calcular pedido automático</button></div>
<div class="cfg">El pedido llega en <input id="ld" type="number" min="0" inputmode="numeric"> días hábiles (lunes→miércoles) y caduca a los <input id="lf" type="number" min="1" inputmode="numeric"> días</div>
<div class="seg"><button id="vd" class="on">Día</button><button id="vw">Semana</button><button id="vs">Estadísticas</button><button id="vf">Foto</button></div>
<div class="info" id="info"></div>
<main id="main"></main>
<p style="text-align:center;font-size:12px;color:var(--m);margin:4px 0 24px"><a href="#" id="wn" style="color:inherit">Cambiar número de WhatsApp de Silvio</a></p>
<script>
var DN=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],DS=["L","M","X","J","V","S"];
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var DEF=[["63758","BOWL XTREME POLLO 210GR",6,1],["63754","BOWL ENS PASTA Y RUCULA",6],["63922","ENSALADA PASTA IFA ELIGES BOWL 265GR",6],["63807","BOWL JAPON ENSALADA",6],["62461","ENSALADA MEZCLUM",8],["56787","VERDURAS MICRO BR,ZA,COL",8],["61950","ENSALADA FRESCA VARIADA",8],["63757","ENS DUO CANONIGOS RUCULA",8],["61943","ENSALADA FRESCA IV ESTACIONES",10,1],["61925","ENSALADA DEL HUERTO 400 G",4],["61944","ENSALADA GOURMET IFA",8],["61936","ICEBERG FRESCA CORTADA IFA",10],["40350","RUCULA BABYLEAF",8],["61945","ACELGAS CORTADA",4],["61959","CANONIGO BOLSA",6],["61926","BROCOLI MICRO MIMAFLOR",8],["61937","ESPINACA FRESCA BOLSA IFA",4],["61930","ENSALADA ESPINACAS BROTES",8],["61931","ENSALADA BROTES TIERNOS",6],["62363","BOWL CESAR IFA 215G",6,1],["63755","BOWL CESAR AMERICAN STYLE",6],["63756","BOWL GOURMET 180 GR",6]];
var KEY="controlSemanal.v1",S={items:DEF.map(function(r){return{c:r[0],n:r[1],k:r[2],h:!!r[3]}}),d:{}};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.cfg)S.cfg={lead:2,cover:2};if(!S.cfg.life)S.cfg.life=5;if(!S.cfg.cap)S.cfg.cap=16;
DEF.forEach(function(r){if(!S.items.some(function(i){return i.c==r[0]}))S.items.push({c:r[0],n:r[1],k:r[2],h:!!r[3]})});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
var mon=monday(new Date()),dow=Math.min((new Date().getDay()+6)%7,5),view="d",todayIso=iso(new Date());
function g(date,c,f){var a=S.d[date];return a&&a[c]&&a[c][f]||0}
function s(date,c,f,v){v=Math.max(0,Math.floor(+v)||0);var a=S.d[date]=S.d[date]||{};a[c]=a[c]||{};a[c][f]=v;save()}
function dl(i){var d=add(mon,i);return d.getDate()+" "+MES[d.getMonth()]}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function head(){
 document.getElementById("rng").textContent=dl(0)+" – "+dl(5);
 document.getElementById("days").innerHTML=DN.map(function(n,i){var d=iso(add(mon,i));return'<button data-d="'+i+'" class="'+(i==dow&&view=="d"?"on ":"")+(d==todayIso?"today":"")+'">'+DS[i]+'<small>'+add(mon,i).getDate()+'</small></button>'}).join("");
}
function stepper(date,it,f,lab,cls){var v=g(date,it.c,f);
 return'<div class="f '+cls+'"><label>'+lab+'</label><div class="st"><button data-a="-" data-c="'+it.c+'" data-f="'+f+'">−</button><input type="number" inputmode="numeric" min="0" value="'+v+'" data-c="'+it.c+'" data-f="'+f+'"><button data-a="+" data-c="'+it.c+'" data-f="'+f+'">+</button></div><div class="u">'+(f=="p"&&v?"= "+v*it.k+" ud":"")+'</div></div>'}
function dayView(){var date=iso(add(mon,dow));
 return'<div class="hint">Toca el nombre de una referencia para activar o quitar su oferta.</div>'+S.items.map(function(it){return'<div class="row'+(it.h?" hl":"")+'"><div class="nm" data-hl="'+it.c+'"><div>'+esc(it.n)+(it.h?' <em class="of">OFERTA</em>':'')+(it.h&&it.o?'<div class="od">'+esc(it.o)+'</div>':'')+'</div><span>'+it.c+' · caja '+it.k+' ud</span></div><div class="cs'+(dow==5?" two":"")+'">'+stepper(date,it,"s","Stock","")+(dow==5?"":stepper(date,it,"p","Pedido (cajas)",""))+stepper(date,it,"v","Venta (ud)","")+'</div></div>'}).join("")||'<div class="empty">Añade una referencia para empezar.</div>'}
function weekView(){
 var th1='<tr><th rowspan="2">Referencia</th>'+DN.map(function(n,i){return'<th colspan="3">'+n.slice(0,3)+" "+add(mon,i).getDate()+'</th>'}).join("")+'</tr>';
 var th2="<tr>"+DN.map(function(){return"<th>S</th><th>P</th><th>V</th>"}).join("")+"</tr>";
 var tot=[];for(var i=0;i<18;i++)tot.push(0);
 var rows=S.items.map(function(it){var t="";DN.forEach(function(_,i){var d=iso(add(mon,i));["s","p","v"].forEach(function(f,j){var v=g(d,it.c,f);if(f=="p")tot[i*3+j]+=v*it.k;else tot[i*3+j]+=v;t+="<td>"+(v?(f=="p"?v:v):"")+"</td>"})});return'<tr class="'+(it.h?"hl":"")+'"><td class="n">'+esc(it.n)+"</td>"+t+"</tr>"}).join("");
 var foot="<tr><td class='n'>Total (pedido en ud)</td>"+tot.map(function(v){return"<td>"+(v||"")+"</td>"}).join("")+"</tr>";
 return'<div class="tw"><table><thead>'+th1+th2+"</thead><tbody>"+rows+"</tbody><tfoot>"+foot+"</tfoot></table></div>"}
function render(){head();info();["au","wa","cp"].forEach(function(id){document.getElementById(id).style.display=((view=="d"&&dow==5)||view=="f")?"none":""});document.getElementById("vd").className=view=="d"?"on":"";document.getElementById("vw").className=view=="w"?"on":"";document.getElementById("vs").className=view=="s"?"on":"";
 document.getElementById("vf").className=view=="f"?"on":"";
 document.getElementById("main").innerHTML=view=="d"?dayView():view=="w"?weekView():view=="s"?statsView():fotoView()}
function orderText(){var date=iso(add(mon,dow)),l=[];
 S.items.forEach(function(it){var v=g(date,it.c,"p");if(v)l.push("- "+it.n+": "+v+(v==1?" caja":" cajas")+" ("+v*it.k+" ud)")});
 return l.length?"Pedido "+DN[dow].toLowerCase()+" "+add(mon,dow).getDate()+":\n"+l.join("\n"):""}
document.getElementById("days").onclick=function(e){var b=e.target.closest("button");if(!b)return;dow=+b.dataset.d;view="d";render()};
document.getElementById("pv").onclick=function(){mon=add(mon,-7);render()};
document.getElementById("nx").onclick=function(){mon=add(mon,7);render()};
document.getElementById("vd").onclick=function(){view="d";render()};
document.getElementById("vw").onclick=function(){view="w";render()};
document.getElementById("vs").onclick=function(){view="s";render()};
document.getElementById("vf").onclick=function(){view="f";render()};
document.getElementById("wa").onclick=function(){var t=orderText();if(!t){alert("No hay pedido cargado para este día.");return}var n=waNum(false);if(!n)return;window.open("https://wa.me/"+n+"?text="+encodeURIComponent(t),"_blank")};
function waNum(force){var n=S.cfg.wa;if(!n||force){var v=prompt("Número de WhatsApp de Silvio (con prefijo, ej. 34600123456)",n||"");if(v===null)return null;v=v.replace(/\D/g,"");if(v.length==9)v="34"+v;if(v.length<10){alert("Número no válido");return null}S.cfg.wa=n=v;save()}return n}
document.getElementById("wn").onclick=function(e){e.preventDefault();waNum(true)};
document.getElementById("cp").onclick=function(){var t=orderText();if(!t){alert("No hay pedido cargado para este día.");return}
 try{navigator.clipboard.writeText(t).then(function(){alert("Pedido copiado")},function(){prompt("Copia el pedido:",t)})}catch(e){prompt("Copia el pedido:",t)}};
document.getElementById("ad").onclick=function(){var c=prompt("Código de la referencia");if(!c)return;var n=prompt("Nombre");if(!n)return;var k=parseInt(prompt("Unidades por caja","6"),10)||1;
 if(S.items.some(function(i){return i.c==c})){alert("Ese código ya existe.");return}S.items.push({c:c.trim(),n:n.trim().toUpperCase(),k:k,h:false});save();render()};
var DNAME=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function plan(base){var a=new Date(base);for(var q=0;q<S.cfg.lead;q++){do{a=add(a,1)}while(a.getDay()==0||a.getDay()==6)}return{a:a,cover:a.getDay()==5?2:1,exp:add(a,S.cfg.life)}}
function dstr(d){return DNAME[d.getDay()]+" "+d.getDate()}
function info(){var el=document.getElementById("info");if(view!="d"||dow>4){el.style.display="none";return}
 var P=plan(add(mon,dow));el.style.display="";
 el.innerHTML="Este pedido llega el <b>"+dstr(P.a)+"</b>.<br>Caduca el <b>"+dstr(P.exp)+"</b> ("+S.cfg.life+" días desde que llega)."}
function has(d,c,f){var a=S.d[d];return !!(a&&a[c]&&a[c][f]!==undefined)}
function openDay(d){return d.getDay()!=0}
function obs(it,date){var w=date.getDay(),A=[],B=[];
 for(var i=1;i<=42;i++){var d=add(date,-i),k=iso(d);if(!has(k,it.c,"v"))continue;var o={v:g(k,it.c,"v"),w:1/(1+0.3*Math.floor((i-1)/7)),d:d.getDay()};B.push(o);if(d.getDay()==w)A.push(o)}
 return{A:A,B:B}}
function wm(L){var s=0,q=0;L.forEach(function(o){s+=o.v*o.w;q+=o.w});return q?s/q:0}
function mean(x){return x.reduce(function(p,c){return p+c},0)/x.length}
function trend(it,date){var a=[],b=[];for(var i=1;i<=14;i++){var k=iso(add(date,-i));if(!has(k,it.c,"v"))continue;(i<=7?a:b).push(g(k,it.c,"v"))}
 if(a.length<3||b.length<3)return 1;var mb=mean(b);if(!mb)return 1;return 1+(Math.min(1.25,Math.max(0.8,mean(a)/mb))-1)*0.5}
function avgFor(it,date){var o=obs(it,date);return(o.A.length?wm(o.A):wm(o.B))*trend(it,date)}
function sdev(it,date){var o=obs(it,date).B;if(o.length<4)return 0;var m=wm(o),v=0,q=0;o.forEach(function(x){v+=x.w*Math.pow(x.v-m,2);q+=x.w});return Math.sqrt(v/q)}
function compute(base){var P=plan(base),rows=[],bk=iso(base);
 S.items.forEach(function(it){var stock=g(bk,it.c,"s"),pend=0,cons=0,dem=0,dd=0,x,y,pd=new Date(base);
  for(var j=1;j<S.cfg.lead;j++){do{pd=add(pd,-1)}while(pd.getDay()==0||pd.getDay()==6);pend+=g(iso(pd),it.c,"p")*it.k}
  for(x=new Date(base);x<P.a;x=add(x,1))if(openDay(x))cons+=avgFor(it,x);
  var sa=Math.max(0,stock+pend-cons),sf=sdev(it,P.a)*0.5*Math.sqrt(P.cover);
  for(y=new Date(P.a);dd<P.cover;y=add(y,1))if(openDay(y)){dem+=avgFor(it,y);dd++}
  var need=dem+(dem?sf:0)-sa,b=need>0.05?Math.ceil(need/it.k-0.01):0,mx=Math.max(0,Math.floor((S.cfg.cap-sa)/it.k)),lim=0;
  if(b>mx){lim=Math.max(0,Math.round(need-mx*it.k));b=mx}
  rows.push({it:it,b:b,lim:lim,dem:dem,sa:sa,days:dem?(sa+b*it.k)/(dem/P.cover):0})});
 return{P:P,rows:rows}}
function calc(){
 var base=add(mon,dow);if(base.getDay()==6||base.getDay()==0){alert("Los sábados y domingos no hay pedidos.");return}
 var bk=iso(base),risk=[],nos=0,lims=[];
 if(S.items.some(function(i){return g(bk,i.c,"p")>0})&&!confirm("Ya hay un pedido cargado en este día. ¿Reemplazarlo por el calculado?"))return;
 var R=compute(base);
 R.rows.forEach(function(r){s(bk,r.it.c,"p",r.b);if(!r.dem)nos++;if(r.lim)lims.push(r.it.n+" (faltarían ~"+r.lim+" ud)");if(r.b&&r.dem&&r.days>S.cfg.life)risk.push(r.it.n+" (~"+r.days.toFixed(1)+" días de venta)")});
 render();
 var m="Pedido de "+DNAME[base.getDay()]+" "+base.getDate()+" calculado. Llega el "+dstr(R.P.a)+" y caduca el "+dstr(R.P.exp)+".";
 if(risk.length)m+="\n\nRiesgo de caducidad (más de "+S.cfg.life+" días para venderse, no se bajó la cantidad):\n- "+risk.join("\n- ");
 if(lims.length)m+="\n\nLimitado por la vitrina (máx. "+S.cfg.cap+" ud por referencia):\n- "+lims.join("\n- ");
 if(nos)m+="\n\n"+nos+" referencia(s) sin ventas registradas: no se pidieron.";
 alert(m)}
function statsView(){var base=add(mon,dow>4?4:dow),R=compute(base),n=0;
 var rows=R.rows.map(function(r){var it=r.it,o=obs(it,base),B=o.B,mu=B.length?wm(B):0,tr=trend(it,base),ar=!B.length?"–":tr>1.03?"↑":tr<0.97?"↓":"→",best="–";
  if(B.length>=6){var by={};B.forEach(function(x){(by[x.d]=by[x.d]||[]).push(x.v)});var bm=-1;Object.keys(by).forEach(function(d){var m=mean(by[d]);if(m>bm){bm=m;best=DNAME[d].slice(0,3)}})}
  n=Math.max(n,B.length);
  return'<tr class="'+(it.h?"hl":"")+'"><td class="n">'+esc(it.n)+"</td><td>"+(B.length?mu.toFixed(1):"–")+"</td><td>"+ar+"</td><td>"+best+"</td><td>"+g(iso(base),it.c,"s")+"</td><td><b>"+(r.dem?r.b+(r.lim?"*":""):"–")+"</b></td></tr>"}).join("");
 return'<div class="info" style="display:block">Pedido del <b>'+dstr(base)+'</b>: llega el <b>'+dstr(R.P.a)+'</b>. Estimación con ponderación de las últimas 6 semanas, tendencia de 7 días y margen por variabilidad de las ventas'+(n<7?". Aún hay pocos días de ventas: la estimación mejora con el uso.":".")+(R.rows.some(function(r){return r.lim})?" * Limitado por la vitrina ("+S.cfg.cap+" ud).":"")+'</div><div class="tw"><table><thead><tr><th>Referencia</th><th>Media/día</th><th>Tend.</th><th>Mejor día</th><th>Stock</th><th>Pedir (cajas)</th></tr></thead><tbody>'+rows+"</tbody></table></div>"}
document.getElementById("au").onclick=calc;
var ld=document.getElementById("ld"),lf=document.getElementById("lf");lf.value=S.cfg.life;lf.onchange=function(){S.cfg.life=Math.max(1,parseInt(lf.value,10)||5);lf.value=S.cfg.life;save();render()};ld.value=S.cfg.lead;ld.onchange=function(){S.cfg.lead=Math.max(0,parseInt(ld.value,10)||0);ld.value=S.cfg.lead;save();render()};
var main=document.getElementById("main");
main.addEventListener("click",function(e){var b=e.target.closest("button[data-a]");
 if(b){var d=iso(add(mon,dow)),v=g(d,b.dataset.c,b.dataset.f)+(b.dataset.a=="+"?1:-1);s(d,b.dataset.c,b.dataset.f,v);var y=window.scrollY;render();window.scrollTo(0,y);return}
 var n=e.target.closest("[data-hl]");if(n){S.items.forEach(function(i){if(i.c==n.dataset.hl){i.h=!i.h;if(i.h){var v=prompt("Oferta de "+i.n+"\nFechas de la oferta (ej. 28/09 al 12/10). Déjalo vacío si no las sabes.",i.o||"");i.o=v?v.trim():""}else i.o=""}});save();render()}});
main.addEventListener("change",function(e){var i=e.target;if(i.tagName!="INPUT"||!i.dataset.c)return;s(iso(add(mon,dow)),i.dataset.c,i.dataset.f,i.value);var y=window.scrollY;render();window.scrollTo(0,y)});
render();
/* ===== Foto: cámara + OCR ===== */
var F={rows:[],raw:"",day:null,pre:"spv",msg:"",busy:false,img:""};
var PRE={spv:["s","p","v"],sv:["s","v"],s:["s"],v:["v"],p:["p"]};
var PREL={spv:"Stock · Pedido · Venta",sv:"Stock · Venta",s:"Solo Stock",v:"Solo Venta",p:"Solo Pedido"};
var FL={s:"Stock",p:"Pedido",v:"Venta"};
function nrm(t){return String(t).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function tokVal(t){t=t.replace(/[.,;:]+$/,"");if(/^\d{1,3}$/.test(t))return +t;if(/^[|Il!1]+$/.test(t))return t.length;if(/^[Oo]$/.test(t))return 0;return null}
function parseSheet(text){var fs=PRE[F.pre],out=[],seen={};
 text.split(/\n+/).forEach(function(line){
  var toks=line.trim().split(/\s+/),it=null,ci=-1,i,k;if(toks.length<2)return;
  for(i=0;i<toks.length&&!it;i++){var d=toks[i].replace(/\D/g,"");if(d.length==5){var f=S.items.filter(function(x){return x.c==d})[0];if(f){it=f;ci=i}}}
  var lw=nrm(line).split(" ");
  if(!it){var best=0,bn=0,tie=false;
   S.items.forEach(function(x){var w=nrm(x.n).split(" ").filter(function(y){return y.length>=3&&!/^\d+$/.test(y)}),hit=w.filter(function(y){return lw.indexOf(y)>=0}).length,sc=w.length?hit/w.length:0;
    if(hit>=Math.min(2,w.length)&&sc>=0.6){if(sc>best||(sc==best&&w.length>bn)){best=sc;bn=w.length;it=x;tie=false}else if(sc==best&&w.length==bn)tie=true}});
   if(tie)it=null}
  if(!it||seen[it.c])return;seen[it.c]=1;
  var nw=nrm(it.n).split(" "),st=ci+1,ud=-1;
  for(i=0;i<toks.length;i++){var nt=nrm(toks[i]);if(nt&&nw.indexOf(nt)>=0)st=Math.max(st,i+1)}
  for(i=Math.max(0,ci+1);i<toks.length;i++){if(/^(UD|UDS|UN|UND)$/i.test(toks[i].replace(/[^A-Za-z]/g,""))){ud=i;break}}
  if(ud>=0)st=Math.max(st,ud+1);
  var vals=[];for(k=st;k<toks.length;k++){var tv=tokVal(toks[k]);if(tv!==null)vals.push(tv)}
  if(ud>=0&&vals.length&&vals[0]==it.k)vals.shift();
  out.push({it:it,v:vals.slice(0,fs.length)})});
 return out}
function loadTess(){return new Promise(function(ok,ko){if(window.Tesseract)return ok();var sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";sc.onload=ok;sc.onerror=function(){ko(new Error("No se pudo cargar el lector de texto. Comprueba la conexión a internet."))};document.head.appendChild(sc)})}
function prep(file){return new Promise(function(ok,ko){var u=URL.createObjectURL(file),im=new Image();
 im.onerror=function(){ko(new Error("No se pudo abrir la imagen."))};
 im.onload=function(){var sc=Math.min(1,2200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
  var dt=x.getImageData(0,0,c.width,c.height),p=dt.data,hs=new Uint32Array(256),n=c.width*c.height,gr=new Uint8Array(n),i,j,q,a=0,lo,hi;
  for(i=0,j=0;i<p.length;i+=4,j++){q=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;gr[j]=q;hs[q]++}
  for(lo=0;lo<255&&(a+=hs[lo])<n*.02;lo++);a=0;for(hi=255;hi>0&&(a+=hs[hi])<n*.02;hi--);if(hi<=lo)hi=lo+1;
  for(i=0,j=0;i<p.length;i+=4,j++){q=Math.max(0,Math.min(255,(gr[j]-lo)*255/(hi-lo)));p[i]=p[i+1]=p[i+2]=q}
  x.putImageData(dt,0,0);ok({canvas:c,url:u})};
 im.src=u})}
function runOcr(file){
 if(F.busy)return;F.busy=true;F.rows=[];F.raw="";if(F.img)URL.revokeObjectURL(F.img);F.img="";F.msg="Preparando la foto…";render();
 prep(file).then(function(r){F.img=r.url;F.msg="Cargando lector de texto (la primera vez tarda un poco)…";render();
  return loadTess().then(function(){return Tesseract.createWorker("spa",1,{logger:function(m){if(m.status=="recognizing text"){var e=document.getElementById("fst");if(e)e.textContent="Leyendo la hoja… "+Math.round(m.progress*100)+"%"}}})}).then(function(w){
   return w.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"}).then(function(){return w.recognize(r.canvas)}).then(function(res){return w.terminate().then(function(){return res})})})})
 .then(function(res){F.raw=res.data.text||"";F.rows=parseSheet(F.raw);F.busy=false;F.msg=F.rows.length?"Se reconocieron "+F.rows.length+" referencias. Revisa los números y cárgalos.":"";render()})
 .catch(function(e){F.busy=false;F.msg=(e&&e.message)||"Error al leer la foto.";render()})}
function rawHtml(){return F.raw?"<details><summary>Texto leído de la foto</summary><pre>"+esc(F.raw)+"</pre></details>":""}
function reviewHtml(){
 if(!F.rows.length)return F.raw?'<div class="empty">No se reconoció ninguna referencia. Prueba con buena luz, el folio recto y completo en la foto.</div>'+rawHtml():"";
 var fs=PRE[F.pre];
 return'<div class="tw"><table><thead><tr><th>Referencia</th>'+fs.map(function(f){return"<th>"+FL[f]+"</th>"}).join("")+"</tr></thead><tbody>"+
  F.rows.map(function(r,i){return'<tr class="'+(r.it.h?"hl":"")+'"><td class="n">'+esc(r.it.n)+"</td>"+fs.map(function(f,j){return'<td><input class="ri" type="number" min="0" inputmode="numeric" value="'+(r.v[j]===undefined?"":r.v[j])+'" data-r="'+i+'" data-j="'+j+'"></td>'}).join("")+"</tr>"}).join("")+
  '</tbody></table></div><div class="bar"><button class="pri" id="fim">Cargar en '+DN[F.day]+" "+add(mon,F.day).getDate()+"</button></div>"+rawHtml()}
function fotoView(){if(F.day===null)F.day=dow;
 return'<div class="info" style="display:block">Haz una foto al folio. La app lee las referencias (por código o nombre) y los números de cada fila, y te los enseña para revisar antes de cargarlos.</div>'+
  '<div class="cf2">Día de la hoja <select id="fd">'+DN.map(function(n,i){return'<option value="'+i+'"'+(i==F.day?" selected":"")+">"+n+"</option>"}).join("")+'</select> Columnas <select id="fp">'+Object.keys(PREL).map(function(k){return'<option value="'+k+'"'+(k==F.pre?" selected":"")+">"+PREL[k]+"</option>"}).join("")+"</select></div>"+
  '<div class="bar"><label class="ph pri">Hacer foto<input type="file" id="fi" accept="image/*" capture="environment" hidden></label><label class="ph">Galería<input type="file" id="fg" accept="image/*" hidden></label></div>'+
  '<div class="hint" id="fst">'+esc(F.msg)+"</div>"+(F.img?'<img class="pv" src="'+F.img+'" alt="">':"")+reviewHtml()+
  '<details><summary>Importar datos pegados</summary><textarea id="it" rows="7" placeholder="Lunes: 63922=1, 62461=1&#10;Martes pedido: 63754=1" style="width:100%;margin-top:6px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;padding:6px"></textarea><div class="bar" style="padding:6px 0 0"><button class="pri" id="ib">Cargar datos</button></div></details>'}
var DX={lun:0,mar:1,mie:2,jue:3,vie:4,sab:5},FX={stock:"s",pedido:"p",venta:"v"};
function importText(){var t=document.getElementById("it").value,ops=[],bad=[],ex=false,n=0;
 t.split(/\n+/).forEach(function(ln){var m=ln.match(/^\s*(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado)\s*(stock|pedido|venta)?\s*:\s*(.+)$/i);if(!m)return;
  var di=DX[nrm(m[1]).slice(0,3).toLowerCase()],f=FX[(m[2]||"pedido").toLowerCase()],re=/(\d{5})\s*=\s*(\d+)/g,p;
  while((p=re.exec(m[3]))){var it=S.items.filter(function(x){return x.c==p[1]})[0];if(!it){bad.push(p[1]);continue}ops.push({d:iso(add(mon,di)),c:it.c,f:f,v:+p[2]})}});
 if(!ops.length){alert("No se encontró ningún dato. Formato: Lunes: 63922=1, 62461=2");return}
 ops.forEach(function(o){var c=g(o.d,o.c,o.f);if(c>0&&c!=o.v)ex=true});
 if(ex&&!confirm("Algunos datos ya existen y son distintos. ¿Sobrescribirlos?"))return;
 ops.forEach(function(o){s(o.d,o.c,o.f,o.v);n++});
 view="w";render();alert(n+" datos cargados en la semana del "+dl(0)+"."+(bad.length?"\nCódigos no reconocidos: "+bad.join(", "):""))}
function importPhoto(){var fs=PRE[F.pre],date=iso(add(mon,F.day)),n=0,ex=false;
 F.rows.forEach(function(r){fs.forEach(function(f,j){if(r.v[j]!==undefined&&!(F.day==5&&f=="p")&&g(date,r.it.c,f)>0)ex=true})});
 if(ex&&!confirm("Ya hay datos en "+DN[F.day]+". ¿Sobrescribirlos con los de la foto?"))return;
 F.rows.forEach(function(r){fs.forEach(function(f,j){var v=r.v[j];if(v===undefined||(F.day==5&&f=="p"))return;s(date,r.it.c,f,v);n++})});
 dow=F.day;view="d";F.rows=[];F.raw="";if(F.img)URL.revokeObjectURL(F.img);F.img="";F.msg="";render();
 alert(n+" datos cargados en "+DN[dow]+" "+add(mon,dow).getDate()+".")}
main.addEventListener("change",function(e){var i=e.target;
 if(i.id=="fi"||i.id=="fg"){var fl=i.files&&i.files[0];if(fl)runOcr(fl);return}
 if(i.id=="fd"){F.day=+i.value;render();return}
 if(i.id=="fp"){F.pre=i.value;F.rows=parseSheet(F.raw);render();return}
 if(i.dataset&&i.dataset.r!==undefined){F.rows[+i.dataset.r].v[+i.dataset.j]=i.value===""?undefined:Math.max(0,Math.floor(+i.value)||0)}});
main.addEventListener("click",function(e){if(e.target.id=="fim")importPhoto();if(e.target.id=="ib")importText()});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
